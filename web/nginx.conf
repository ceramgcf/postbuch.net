server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Always revalidate entry files so clients pick up new deployments quickly.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        expires -1;
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        expires -1;
        try_files $uri =404;
    }

    # Setup-Restore (Adminpasswort erforderlich, nur aktiv solange Flag existiert)
    location /setup/ {
        proxy_pass http://app:3421/setup/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 500M;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Digital Asset Links – exakter Match vor dem SPA-Fallback
    location = /.well-known/assetlinks.json {
        proxy_pass http://app:3421/.well-known/assetlinks.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed assets: no-cache so browsers revalidate via ETag even when the
    # filename hash happens to be identical across two successive builds.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }

    # React-PDF/PDF.js liefert seinen Worker als ES-Modul mit der Endung .mjs.
    # Alpine-nginx kennt diese Endung in seiner Standard-MIME-Tabelle nicht und
    # würde sie deshalb als application/octet-stream ausliefern. Wegen nosniff
    # lehnen Browser den Worker dann ab und PDF.js fällt auf einen Fake-Worker
    # zurück. Der separate Block erhält die gleiche Cache-/Security-Policy wie
    # andere Assets, aber den korrekten JavaScript-Default.
    location ~ \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }

    # Anwenderdokumentation für die In-App-Hilfe (/hilfe). Eigener Block aus
    # zwei Gründen: ein fehlendes Kapitel muss eine echte 404 liefern statt der
    # SPA-index.html (sonst rendert die Hilfe stillschweigend HTML als Markdown),
    # und die Kapitel sollen nach einem Deploy sofort in der neuen Fassung
    # erscheinen – dieselbe no-cache-Politik wie bei /assets/.
    location /docs/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        default_type text/plain;
        try_files $uri =404;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Interne Endpunkte NIE nach außen durchreichen.
    # /api/webhooks/*  – Scan-Pipeline (fremde PDFs einschleusen, LLM-Kosten, OneDrive-Writes)
    # /api/internal/*  – Scanner-/Cleaner-Config inkl. webhook_token
    # Beide werden ausschließlich container-intern über app:3421 aufgerufen
    # (docker-compose.yml: APP_URL/APP_WEBHOOK_URL zeigen direkt auf app), nie
    # vom Frontend. Längeres Präfix gewinnt in nginx – steht vor "location /api/".
    # /api/public/scanner-port bleibt bewusst erreichbar (Frontend nutzt es).
    location /api/webhooks { return 404; }
    location /api/internal { return 404; }

    # Dokumentenübergabe-Import: rohes ZIP bis 2 GB, echtes Streaming statt
    # Base64/JSON. proxy_request_buffering off verhindert, dass nginx den
    # kompletten Body erst zwischenspeichert, bevor er an app weitergereicht
    # wird — sonst wäre der RAM-/Platzvorteil des Streamings im Backend
    # wirkungslos. Längeres Präfix vor "location /api/" platziert.
    location /api/import/archiv {
        proxy_pass http://app:3421/api/import/archiv;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 2100M;
        # Der Upload selbst kann bei langsamen Verbindungen und mehreren GB
        # lange dauern; die eigentliche Verarbeitung läuft danach asynchron
        # im Hintergrund (Antwort ist bereits 202, sobald der Upload steht).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://app:3421/api/;
        proxy_http_version 1.1;
        # API-Daten und Redirects niemals im Browserprofil konservieren. Das ist
        # besonders bei Update/Rollback wichtig, weil Chrome permanente
        # Redirects unabhängig von Service-Worker-/Website-Daten behalten kann.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For MUSS hier gesetzt werden, sonst reicht nginx einen vom
        # Client frei erfundenen Header unverändert an app durch – und mit
        # `trust proxy 1` würde Express diesen als req.ip übernehmen (spoofbar,
        # relevant für login-rate-limit.js auf dem unauthentifizierten Login).
        # $proxy_add_x_forwarded_for hängt die echte Peer-IP rechts an; Express
        # vertraut nur diesem letzten (von nginx gesetzten) Eintrag. Beim direkten
        # LAN-Zugriff ist das die Client-IP, hinter Caddy dessen IP – in keinem
        # Fall mehr client-steuerbar.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the X-Forwarded-Proto set by Caddy (https).
        # Express (trust proxy 1) falls back to the socket scheme when this is empty.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Uploads: bis zu ~100 MB (Merge mehrerer PDFs, base64-vergrößert)
        client_max_body_size 150M;
        # Scanner-Aufrufe können bis zu 5 Minuten dauern (ADF mit vielen Seiten, 600dpi)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
